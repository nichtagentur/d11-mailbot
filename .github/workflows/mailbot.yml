name: d11-mailbot
# Alle 5 Minuten: Postfach einmal pruefen, Mails von MAILBOT_OWNER beantworten.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Testfrage: schickt eine Test-Antwort an MAILBOT_OWNER (leer = normal Postfach pruefen)'
        required: false
        default: ''
concurrency:
  group: mailbot
  cancel-in-progress: false
permissions:
  contents: read
  actions: write   # nur fuer den Keepalive unten
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium (fuer den Screenshot)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Postfach pruefen
        run: |
          if [ -n "$SELFTEST" ]; then node bot.mjs --selftest "$SELFTEST"; else node bot.mjs --once; fi
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAILBOT_OWNER: ${{ secrets.MAILBOT_OWNER }}
          MAILBOT_PUSH_URL: ${{ secrets.MAILBOT_PUSH_URL }}
          MAILBOT_PUSH_SECRET: ${{ secrets.MAILBOT_PUSH_SECRET }}
          SELFTEST: ${{ inputs.selftest }}
          # optional fuer ein eigenes Postfach (Repository-Variablen):
          MAILBOT_USER: ${{ vars.MAILBOT_USER }}
          MAILBOT_IMAP_HOST: ${{ vars.MAILBOT_IMAP_HOST }}
          MAILBOT_SMTP_HOST: ${{ vars.MAILBOT_SMTP_HOST }}
          MAILBOT_APP_URL: ${{ vars.MAILBOT_APP_URL }}
          MAILBOT_FOLDERS: ${{ vars.MAILBOT_FOLDERS }}
      - name: Keepalive (GitHub pausiert Zeitplaene sonst nach 60 Tagen ohne Aenderung)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mailbot.yml/enable"
